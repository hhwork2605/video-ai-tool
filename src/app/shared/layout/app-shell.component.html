<div class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
  <!-- TOOLBAR -->
  <p-toolbar
    styleClass="!sticky top-0 z-30 !rounded-none !border-0 shadow-md !bg-primary-600 !text-white"
  >
    <ng-template pTemplate="start">
      <a
        routerLink="/idea"
        class="flex items-center gap-2 no-underline text-inherit"
      >
        <i class="pi pi-video text-xl"></i>
        <span class="hidden sm:inline font-semibold tracking-tight">
          Video AI Tool
        </span>
      </a>
    </ng-template>
    <ng-template pTemplate="end">
      <ng-container *ngIf="state.current() as p">
        <span class="text-xs sm:text-sm opacity-90">
          <span class="hidden md:inline">Project </span>
          <code
            class="font-mono text-[11px] sm:text-xs bg-white/20 px-1.5 py-0.5 rounded"
          >
            {{ p.id.slice(0, 8) }}
          </code>
        </span>
      </ng-container>
    </ng-template>
  </p-toolbar>

  <!-- Wizard indicator -->
  <div
    *ngIf="state.current() as p"
    class="bg-white border-b border-slate-200 px-2 sm:px-6"
  >
    <div class="mx-auto max-w-6xl">
      <app-wizard-stepper [current]="state.stage()" [projectId]="p.id" />
    </div>
  </div>

  <!-- MAIN -->
  <main class="flex-1 w-full">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
      <router-outlet />
    </div>
  </main>

  <!-- FOOTER -->
  <footer
    class="border-t border-slate-200 bg-white text-center text-xs text-slate-500 py-4"
  >
    Video AI Tool · MVP · {{ year }}
  </footer>

  <!-- Global toast (PrimeNG MessageService -> p-toast) -->
  <p-toast position="top-right" />
</div>
