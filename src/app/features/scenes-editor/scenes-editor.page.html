<div class="space-y-6 animate-fade-in">
  <div class="flex items-start justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
        Tạo ảnh & video cho từng scene
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        {{ scenes().length }} scene · tỷ lệ
        <strong>{{ aspectMeta().label }}</strong>
        · cost dự kiến
        <strong class="text-primary-700">~{{ estimatedCost() }}</strong>
      </p>
    </div>
    <div class="flex flex-wrap gap-2">
      <p-button
        label="Đổi kịch bản"
        icon="pi pi-arrow-left"
        [text]="true"
        (onClick)="back()"
      />
      <p-button
        [label]="busyBuildPrompts() ? 'Đang build…' : 'Build prompts'"
        icon="pi pi-sparkles"
        [outlined]="true"
        [loading]="busyBuildPrompts()"
        loadingIcon="pi pi-spin pi-spinner"
        (onClick)="buildPrompts()"
        pTooltip="Sinh image_prompt + motion_prompt cho mọi scene"
      />
      <p-button
        [label]="busyAllImages() ? 'Đang gen ảnh…' : 'Gen all images'"
        icon="pi pi-images"
        [outlined]="true"
        [loading]="busyAllImages()"
        loadingIcon="pi pi-spin pi-spinner"
        [disabled]="!allHavePrompts()"
        (onClick)="genAllImages()"
      />
      <p-button
        label="Gen all videos"
        icon="pi pi-video"
        [outlined]="true"
        [disabled]="busyAllVideos() || !allHaveImages()"
        (onClick)="genAllVideos()"
        pTooltip="Veo3: ~$0.4/giây video"
      />
      <p-button
        [label]="rendering() ? 'Đang render…' : 'Render & sang Publish'"
        icon="pi pi-arrow-right"
        iconPos="right"
        [loading]="rendering()"
        loadingIcon="pi pi-spin pi-spinner"
        [disabled]="!allHaveVideos()"
        severity="primary"
        (onClick)="renderAndGoPublish()"
      />
    </div>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
    <app-scene-card
      *ngFor="let s of scenes()"
      [scene]="s"
      [aspectRatio]="aspectRatio()"
      (genImage)="genImage($event)"
      (genVideo)="genVideo($event)"
    />
  </div>
</div>
