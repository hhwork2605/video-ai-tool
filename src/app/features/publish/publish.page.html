<div class="space-y-6 animate-fade-in">
  <div class="flex items-start justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Xuất bản</h1>
      <p class="text-sm text-slate-500 mt-1">
        Sao chép caption + hashtag, tải video, đăng lên MXH yêu thích.
      </p>
    </div>
    <p-button
      label="Sửa scenes"
      icon="pi pi-arrow-left"
      [text]="true"
      (onClick)="back()"
    />
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
    <!-- Video preview -->
    <p-card styleClass="lg:col-span-3">
      <ng-template pTemplate="header">
        <div
          class="bg-black flex items-center justify-center mx-auto rounded-t"
          [ngClass]="previewWrapClass()"
        >
          <video
            *ngIf="project()?.finalVideoUrl"
            [src]="project()!.finalVideoUrl!"
            controls
            class="w-full h-full object-contain"
          ></video>
          <div
            *ngIf="!project()?.finalVideoUrl"
            class="flex flex-col items-center text-slate-400 gap-2 p-8"
          >
            <i class="pi pi-video text-5xl"></i>
            <p class="text-sm">Video cuối chưa được render</p>
            <p class="text-xs text-slate-500">
              Quay lại Scenes Editor để render trước
            </p>
          </div>
        </div>
      </ng-template>

      <ng-template pTemplate="footer">
        <div class="flex justify-center gap-2 flex-wrap">
          <p-button
            label="Tải MP4"
            icon="pi pi-download"
            [disabled]="!project()?.finalVideoUrl"
            (onClick)="download()"
          />
          <a
            *ngIf="project()?.finalVideoUrl"
            [href]="project()!.finalVideoUrl!"
            target="_blank"
            rel="noopener"
          >
            <p-button
              label="Mở tab mới"
              icon="pi pi-external-link"
              [outlined]="true"
            />
          </a>
        </div>
      </ng-template>
    </p-card>

    <!-- Metadata sidebar -->
    <div class="lg:col-span-2 space-y-4">
      <p-card>
        <ng-template pTemplate="header">
          <div class="flex items-center justify-between p-4 pb-0">
            <h3 class="text-base font-semibold">Metadata MXH</h3>
            <p-button
              *ngIf="!loading()"
              label="Gen lại"
              icon="pi pi-refresh"
              [outlined]="true"
              size="small"
              (onClick)="regenerate()"
              pTooltip="Gen lại bằng AI"
            />
          </div>
        </ng-template>

        <div *ngIf="loading()" class="flex justify-center py-6">
          <p-progressSpinner styleClass="!w-9 !h-9" strokeWidth="3" />
        </div>

        <ng-container *ngIf="!loading() && meta() as m">
          <div class="space-y-4">
            <p-floatlabel variant="on" styleClass="block">
              <input
                pInputText
                id="ptitle"
                [(ngModel)]="m.title"
                maxlength="60"
                class="w-full"
              />
              <label for="ptitle">Tiêu đề</label>
            </p-floatlabel>
            <div class="flex justify-end -mt-2">
              <p-button
                label="Copy tiêu đề"
                icon="pi pi-copy"
                size="small"
                [text]="true"
                (onClick)="copy(m.title, 'tiêu đề')"
              />
            </div>

            <p-floatlabel variant="on" styleClass="block">
              <textarea
                pTextarea
                id="pcaption"
                [(ngModel)]="m.caption"
                rows="4"
                maxlength="280"
                class="w-full"
              ></textarea>
              <label for="pcaption">Caption</label>
            </p-floatlabel>
            <div class="flex justify-end -mt-2">
              <p-button
                label="Copy caption"
                icon="pi pi-copy"
                size="small"
                [text]="true"
                (onClick)="copy(m.caption, 'caption')"
              />
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-medium text-slate-700">
                  Hashtags ({{ m.hashtags.length }})
                </label>
                <p-button
                  label="Copy tất cả"
                  icon="pi pi-copy"
                  size="small"
                  [outlined]="true"
                  (onClick)="copyHashtags(m.hashtags)"
                />
              </div>
              <div class="flex flex-wrap gap-1.5">
                <p-chip
                  *ngFor="let h of m.hashtags"
                  [label]="'#' + h"
                  styleClass="!bg-primary-100 !text-primary-700"
                />
              </div>
            </div>

            <p-divider />

            <p-button
              label="Copy caption + hashtag"
              icon="pi pi-copy"
              severity="primary"
              styleClass="w-full"
              (onClick)="copyAll(m)"
            />
          </div>
        </ng-container>

        <p-button
          *ngIf="!loading() && !meta()"
          label="Gen tiêu đề + hashtag"
          icon="pi pi-sparkles"
          severity="primary"
          styleClass="w-full"
          (onClick)="regenerate()"
        />
      </p-card>

      <p-card>
        <ng-template pTemplate="header">
          <div class="p-4 pb-0">
            <h3 class="text-sm font-semibold">Đăng nhanh</h3>
            <p class="text-xs text-slate-500 mt-1">
              Caption đã copy sẵn — chỉ cần paste vào app.
            </p>
          </div>
        </ng-template>

        <div class="grid grid-cols-3 gap-2">
          <a
            *ngFor="let s of socials"
            [href]="s.url"
            target="_blank"
            rel="noopener"
          >
            <p-button
              [label]="s.label"
              [icon]="s.icon"
              [outlined]="true"
              size="small"
              styleClass="w-full"
            />
          </a>
        </div>
      </p-card>
    </div>
  </div>
</div>
