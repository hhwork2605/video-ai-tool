<div class="space-y-6 animate-fade-in">
  <div class="flex items-start justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
        Chọn kịch bản bạn thích nhất
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        AI đã gen {{ candidates().length }} phương án. Click card để chọn rồi
        bấm "Dùng kịch bản này".
      </p>
    </div>
    <p-button
      label="Sửa ý tưởng"
      icon="pi pi-pencil"
      [text]="true"
      (onClick)="goBack()"
    />
  </div>

  <div *ngIf="loading()" class="flex justify-center py-12">
    <p-progressSpinner styleClass="!w-12 !h-12" strokeWidth="3" />
  </div>

  <div
    *ngIf="!loading()"
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
  >
    <div *ngFor="let c of candidates()" (click)="selectedId.set(c.id)">
      <app-candidate-card
        [candidate]="c"
        [selected]="selectedId() === c.id"
      />
    </div>
  </div>

  <!-- Sticky action bar -->
  <div
    *ngIf="!loading() && selectedId()"
    class="sticky bottom-4 z-20 mx-auto max-w-2xl animate-slide-up"
  >
    <p-card styleClass="!shadow-xl !border-2 !border-primary-300">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 min-w-0">
          <i class="pi pi-check-circle text-primary-600 text-xl"></i>
          <span class="text-sm truncate">
            Đã chọn: <strong>{{ selectedCandidate()?.title }}</strong>
          </span>
        </div>
        <p-button
          label="Dùng kịch bản này"
          icon="pi pi-arrow-right"
          iconPos="right"
          [loading]="confirming()"
          loadingIcon="pi pi-spin pi-spinner"
          (onClick)="confirm()"
        />
      </div>
    </p-card>
  </div>
</div>
