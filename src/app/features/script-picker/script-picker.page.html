<div class="space-y-6 animate-fade-in">
  <div class="flex items-start justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
        Chọn kịch bản bạn thích nhất
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        AI đã gen {{ candidates().length }} phương án. Click card để chọn rồi
        bấm "Dùng kịch bản này".
      </p>
    </div>
    <button mat-button (click)="goBack()">
      <mat-icon>edit</mat-icon>
      Sửa ý tưởng
    </button>
  </div>

  <div *ngIf="loading()" class="flex justify-center py-12">
    <mat-progress-spinner mode="indeterminate" diameter="48" />
  </div>

  <div
    *ngIf="!loading()"
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
  >
    <div *ngFor="let c of candidates()" (click)="selectedId.set(c.id)">
      <app-candidate-card
        [candidate]="c"
        [selected]="selectedId() === c.id"
      />
    </div>
  </div>

  <div
    *ngIf="!loading() && selectedId()"
    class="sticky bottom-4 z-20 mx-auto max-w-2xl animate-slide-up"
  >
    <mat-card appearance="raised" class="!shadow-xl">
      <mat-card-content
        class="!p-3 sm:!p-4 flex items-center justify-between gap-3"
      >
        <div class="flex items-center gap-2 min-w-0">
          <mat-icon class="text-primary">check_circle</mat-icon>
          <span class="text-sm truncate">
            Đã chọn: <strong>{{ selectedCandidate()?.title }}</strong>
          </span>
        </div>
        <button
          mat-flat-button
          color="primary"
          [disabled]="confirming()"
          (click)="confirm()"
        >
          <ng-container *ngIf="!confirming()">
            Dùng kịch bản này
            <mat-icon iconPositionEnd>arrow_forward</mat-icon>
          </ng-container>
          <ng-container *ngIf="confirming()">
            <mat-progress-spinner
              mode="indeterminate"
              diameter="20"
            ></mat-progress-spinner>
            <span class="ml-2">Đang tải…</span>
          </ng-container>
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
