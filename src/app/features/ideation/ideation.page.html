<div class="space-y-8 animate-fade-in">
  <section class="text-center max-w-2xl mx-auto">
    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight">
      Biến ý tưởng thành video chỉ trong vài phút
    </h1>
    <p class="mt-3 text-sm sm:text-base text-slate-600">
      Mô tả ý tưởng → AI gen kịch bản → bạn chọn → AI gen ảnh + video → đăng MXH.
    </p>
  </section>

  <p-card styleClass="max-w-3xl mx-auto !shadow-md">
    <div class="space-y-6 p-2 sm:p-4">
      <!-- Idea textarea -->
      <div>
        <p-floatlabel variant="on">
          <textarea
            pTextarea
            id="idea"
            [(ngModel)]="ideaText"
            (ngModelChange)="saveDraft()"
            rows="4"
            maxlength="500"
            class="w-full"
            autoResize
          ></textarea>
          <label for="idea">
            <i class="pi pi-lightbulb mr-1"></i>
            Ý tưởng video của bạn
          </label>
        </p-floatlabel>
        <small class="text-slate-400 block text-right mt-1">
          {{ ideaText.length }} / 500
        </small>
      </div>

      <!-- Audience + Language -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <p-floatlabel variant="on">
            <input
              pInputText
              id="audience"
              [(ngModel)]="audience"
              (ngModelChange)="saveDraft()"
              class="w-full"
            />
            <label for="audience">
              <i class="pi pi-users mr-1"></i>
              Đối tượng xem
            </label>
          </p-floatlabel>
          <small class="text-slate-400 block mt-1 ml-1">
            VD: Gen Z, dân văn phòng…
          </small>
        </div>
        <p-floatlabel variant="on">
          <p-select
            inputId="lang"
            [options]="languageOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="language"
            (ngModelChange)="saveDraft()"
            styleClass="w-full"
          />
          <label for="lang">
            <i class="pi pi-globe mr-1"></i>
            Ngôn ngữ
          </label>
        </p-floatlabel>
      </div>

      <!-- Aspect ratio -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Tỷ lệ video
        </label>
        <p-selectButton
          [options]="aspectOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedAspect"
          (ngModelChange)="saveDraft()"
          styleClass="w-full flex"
        >
          <ng-template let-opt #item>
            <div class="flex flex-col items-center gap-1.5 py-2 px-4">
              <div
                class="bg-gradient-to-br from-slate-300 to-slate-400 rounded w-8 sm:w-10"
                [ngClass]="opt.previewClass"
              ></div>
              <span class="text-xs sm:text-sm">{{ opt.label }}</span>
            </div>
          </ng-template>
        </p-selectButton>
      </div>

      <!-- Duration + Candidate count -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p-floatlabel variant="on">
          <p-select
            inputId="duration"
            [options]="durationOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="durationModel"
            (ngModelChange)="saveDraft()"
            styleClass="w-full"
          />
          <label for="duration">
            <i class="pi pi-clock mr-1"></i>
            Độ dài mong muốn
          </label>
        </p-floatlabel>

        <p-floatlabel variant="on">
          <p-select
            inputId="count"
            [options]="candidateOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="candidateModel"
            (ngModelChange)="saveDraft()"
            styleClass="w-full"
          />
          <label for="count">
            <i class="pi pi-list mr-1"></i>
            Số kịch bản AI gen
          </label>
        </p-floatlabel>
      </div>

      <!-- CTA — bọc div để space-y-6 ở parent apply margin-top (p-button host
           không tạo box layout chuẩn nên Tailwind sibling selector miss). -->
      <div class="pt-2">
        <p-button
          label="Sinh {{ candidateModel }} kịch bản"
          icon="pi pi-sparkles"
          [loading]="loading()"
          loadingIcon="pi pi-spin pi-spinner"
          [disabled]="!ideaText.trim()"
          (onClick)="generate()"
          severity="primary"
          size="large"
          styleClass="w-full"
        />
      </div>
    </div>
  </p-card>
</div>
