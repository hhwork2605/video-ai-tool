<div class="space-y-8 animate-fade-in">
  <section class="text-center max-w-2xl mx-auto">
    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight">
      Biến ý tưởng thành video chỉ trong vài phút
    </h1>
    <p class="mt-3 text-sm sm:text-base text-slate-600">
      Mô tả ý tưởng → AI gen kịch bản → bạn chọn → AI gen ảnh + video → đăng MXH.
    </p>
  </section>

  <p-card styleClass="max-w-3xl mx-auto !shadow-md">
    <div class="space-y-6 p-2 sm:p-4">
      <!-- Idea textarea -->
      <div>
        <p-floatlabel variant="on">
          <textarea
            pTextarea
            id="idea"
            [(ngModel)]="ideaText"
            rows="4"
            maxlength="500"
            class="w-full"
            autoResize
          ></textarea>
          <label for="idea">
            <i class="pi pi-lightbulb mr-1"></i>
            Ý tưởng video của bạn
          </label>
        </p-floatlabel>
        <small class="text-slate-400 block text-right mt-1">
          {{ ideaText.length }} / 500
        </small>
      </div>

      <!-- Audience + Language -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p-floatlabel variant="on">
          <input
            pInputText
            id="audience"
            [(ngModel)]="audience"
            class="w-full"
            placeholder="Gen Z, dân văn phòng…"
          />
          <label for="audience">
            <i class="pi pi-users mr-1"></i>
            Đối tượng xem
          </label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <p-select
            inputId="lang"
            [options]="languageOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="language"
            styleClass="w-full"
          />
          <label for="lang">
            <i class="pi pi-globe mr-1"></i>
            Ngôn ngữ
          </label>
        </p-floatlabel>
      </div>

      <!-- Aspect ratio -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Tỷ lệ video
        </label>
        <p-selectButton
          [options]="aspectOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedAspect"
          styleClass="w-full flex"
        >
          <ng-template let-opt #item>
            <div class="flex flex-col items-center gap-1.5 py-2 px-4">
              <div
                class="bg-gradient-to-br from-slate-300 to-slate-400 rounded w-8 sm:w-10"
                [ngClass]="opt.previewClass"
              ></div>
              <span class="text-xs sm:text-sm">{{ opt.label }}</span>
            </div>
          </ng-template>
        </p-selectButton>
      </div>

      <!-- Duration -->
      <div>
        <label
          class="flex items-center justify-between text-sm font-medium text-slate-700 mb-2"
        >
          <span>Độ dài mong muốn</span>
          <span class="text-primary-600 font-semibold">{{ durationSec() }}s</span>
        </label>
        <p-slider
          [(ngModel)]="durationModel"
          (onChange)="durationSec.set(durationModel)"
          [min]="10"
          [max]="120"
          [step]="5"
          styleClass="w-full"
        />
      </div>

      <!-- Candidate count -->
      <div>
        <label
          class="flex items-center justify-between text-sm font-medium text-slate-700 mb-2"
        >
          <span>Số kịch bản AI gen</span>
          <span class="text-primary-600 font-semibold">
            {{ candidateCount() }}
          </span>
        </label>
        <p-slider
          [(ngModel)]="candidateModel"
          (onChange)="candidateCount.set(candidateModel)"
          [min]="1"
          [max]="5"
          [step]="1"
          styleClass="w-full"
        />
      </div>

      <!-- CTA -->
      <p-button
        label="Sinh {{ candidateCount() }} kịch bản"
        icon="pi pi-sparkles"
        [loading]="loading()"
        loadingIcon="pi pi-spin pi-spinner"
        [disabled]="!ideaText.trim()"
        (onClick)="generate()"
        severity="primary"
        size="large"
        styleClass="w-full"
      />
    </div>
  </p-card>
</div>
