<div class="space-y-8 animate-fade-in">
  <section class="text-center max-w-2xl mx-auto">
    <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight">
      Biến ý tưởng thành video chỉ trong vài phút
    </h1>
    <p class="mt-3 text-sm sm:text-base text-slate-600">
      Mô tả ý tưởng → AI gen kịch bản → bạn chọn → AI gen ảnh + video → đăng MXH.
    </p>
  </section>

  <mat-card appearance="outlined" class="max-w-3xl mx-auto">
    <mat-card-content class="!p-4 sm:!p-6 space-y-5">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Ý tưởng video của bạn</mat-label>
        <textarea
          matInput
          [(ngModel)]="ideaText"
          rows="4"
          placeholder="Ví dụ: Video review 3 quán cà phê yên tĩnh ở quận 1 cho dân làm việc remote."
          maxlength="500"
        ></textarea>
        <mat-hint align="end">{{ ideaText.length }} / 500</mat-hint>
        <mat-icon matPrefix>lightbulb</mat-icon>
      </mat-form-field>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <mat-form-field appearance="outline">
          <mat-label>Đối tượng xem</mat-label>
          <input
            matInput
            [(ngModel)]="audience"
            placeholder="Gen Z, dân văn phòng, mẹ bỉm sữa…"
          />
          <mat-icon matPrefix>group</mat-icon>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Ngôn ngữ</mat-label>
          <mat-select [(ngModel)]="language">
            <mat-option value="vi">Tiếng Việt</mat-option>
            <mat-option value="en">English</mat-option>
          </mat-select>
          <mat-icon matPrefix>language</mat-icon>
        </mat-form-field>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Tỷ lệ video
        </label>
        <mat-button-toggle-group
          [value]="aspectRatio()"
          (change)="aspectRatio.set($event.value)"
          hideSingleSelectionIndicator
          class="!w-full !flex"
        >
          <mat-button-toggle
            *ngFor="let opt of aspectOptions"
            [value]="opt.value"
            class="!flex-1"
          >
            <div class="flex flex-col items-center gap-1.5 py-2">
              <div
                class="bg-gradient-to-br from-slate-300 to-slate-400 rounded w-8 sm:w-10"
                [ngClass]="opt.previewClass"
              ></div>
              <span class="text-xs sm:text-sm">{{ opt.label }}</span>
            </div>
          </mat-button-toggle>
        </mat-button-toggle-group>
      </div>

      <div>
        <label
          class="flex items-center justify-between text-sm font-medium text-slate-700 mb-1"
        >
          <span>Độ dài mong muốn</span>
          <span class="text-brand-600 font-semibold">{{ durationSec() }}s</span>
        </label>
        <mat-slider min="10" max="120" step="5" discrete showTickMarks class="w-full">
          <input
            matSliderThumb
            [ngModel]="durationSec()"
            (ngModelChange)="durationSec.set(+$event)"
          />
        </mat-slider>
      </div>

      <div>
        <label
          class="flex items-center justify-between text-sm font-medium text-slate-700 mb-1"
        >
          <span>Số kịch bản AI gen</span>
          <span class="text-brand-600 font-semibold">{{ candidateCount() }}</span>
        </label>
        <mat-slider min="1" max="5" step="1" discrete showTickMarks class="w-full">
          <input
            matSliderThumb
            [ngModel]="candidateCount()"
            (ngModelChange)="candidateCount.set(+$event)"
          />
        </mat-slider>
      </div>

      <button
        mat-flat-button
        color="primary"
        class="!w-full !h-12 !text-base"
        [disabled]="loading() || !ideaText.trim()"
        (click)="generate()"
      >
        <ng-container *ngIf="!loading()">
          <mat-icon>auto_awesome</mat-icon>
          Sinh {{ candidateCount() }} kịch bản
        </ng-container>
        <ng-container *ngIf="loading()">
          <mat-progress-spinner
            mode="indeterminate"
            diameter="20"
          ></mat-progress-spinner>
          <span class="ml-2">Đang gọi AI…</span>
        </ng-container>
      </button>
    </mat-card-content>
  </mat-card>
</div>
